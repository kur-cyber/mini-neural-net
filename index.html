<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-ассистент (Без ключа)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #e2e8f0;
    margin: 0; display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1rem; margin: 0; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg.bot  { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
  .msg.error{ align-self: center; background: #7f1d1d; color: #fecaca; font-size: .85rem; text-align: center; }
  .msg.typing { color: #64748b; font-style: italic; }
  form {
    display: flex; gap: 8px; padding: 12px 16px;
    background: #1e293b; border-top: 1px solid #334155;
  }
  form textarea {
    flex: 1; resize: none; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    font-size: 1rem; font-family: inherit; min-height: 44px; max-height: 120px;
  }
  form button {
    padding: 0 20px; border: none; border-radius: 8px;
    background: #38bdf8; color: #0f172a; font-weight: 700;
    cursor: pointer; font-size: 1rem;
  }
  form button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>🤖 AI-ассистент (Работает без ключа)</h1>
</header>

<div id="messages">
  <div class="msg bot">Привет! Школьный фильтр обойден 🛡️ Я работаю через открытые бесплатные шлюзы без ключей. Просто напиши свой вопрос, и я решу задачу пошагово.</div>
</div>

<form id="chat-form">
  <textarea id="input" placeholder="Задай вопрос... (Enter — отправить)" rows="1"></textarea>
  <button type="submit" id="send">Отправить</button>
</form>

<script>
const messagesEl = document.getElementById('messages');
const form       = document.getElementById('chat-form');
const input      = document.getElementById('input');
const sendBtn    = document.getElementById('send');

// Список бесплатных публичных шлюзов (OpenAI-совместимые)
const GATEWAYS = [
  {
    url: 'https://keylessai.thryx.workers.dev/v1/chat/completions',
    model: 'gpt-4o',
    headers: {}
  },
  {
    url: 'https://text.pollinations.ai/openai',
    model: 'openai',
    headers: {}
  }
];

let history = [];
let busy    = false;

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy) return;

  const text = input.value.trim();
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  busy = true; sendBtn.disabled = true;
  const typing = addMsg('typing', 'думаю...');

  let success = false;

  // Пробуем шлюзы по очереди, пока один не ответит
  for (const gateway of GATEWAYS) {
    try {
      const res = await fetch(gateway.url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...gateway.headers
        },
        body: JSON.stringify({
          model: gateway.model,
          messages: [
            { role: 'system', content: 'Ты полезный ассистент. Отвечай по-русски, по делу. Задачи решай пошагово.' },
            ...history,
          ],
          temperature: 0.7,
        }),
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      const answer = data.choices?.[0]?.message?.content;

      if (answer) {
        typing.remove();
        addMsg('bot', answer);
        history.push({ role: 'assistant', content: answer });
        success = true;
        break; // Успех — выходим из цикла
      }
    } catch (err) {
      // Если этот шлюз упал — пробуем следующий
      console.warn(`Шлюз ${gateway.url} не ответил:`, err);
    }
  }

  if (!success) {
    typing.remove();
    addMsg('error', 'Не удалось связаться с AI через доступные шлюзы. Возможно, школа блокирует и их. Попробуй открыть сайт дома или через мобильный интернет.');
    history.pop();
  }

  busy = false; sendBtn.disabled = false; input.focus();
});
</script>

</body>
</html>
