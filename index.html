<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Программист</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #e2e8f0;
    margin: 0; display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1rem; margin: 0; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 90%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    font-family: monospace; font-size: 0.95rem;
  }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; font-family: inherit; }
  .msg.bot  { align-self: flex-start; background: #1e293b; border: 1px solid #334155; width: 90%; }
  .msg.error{ align-self: center; background: #7f1d1d; color: #fecaca; font-size: .85rem; text-align: center; font-family: inherit; }
  .msg.typing { color: #64748b; font-style: italic; font-family: inherit; }
  form {
    display: flex; gap: 8px; padding: 12px 16px;
    background: #1e293b; border-top: 1px solid #334155;
  }
  form textarea {
    flex: 1; resize: none; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    font-size: 1rem; font-family: monospace; min-height: 60px; max-height: 200px;
  }
  form button {
    padding: 0 20px; border: none; border-radius: 8px;
    background: #38bdf8; color: #0f172a; font-weight: 700;
    cursor: pointer; font-size: 1rem;
  }
  form button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>🤖 AI-Программист (Python / C++)</h1>
</header>

<div id="messages">
  <div class="msg bot">Привет! Я настроен на решение задач по Python и C++. 
Скидывай условие задачи, и я напишу решение. Если нужно "ТОЛЬКО функцию" — я напишу только функцию без лишнего кода.</div>
</div>

<form id="chat-form">
  <textarea id="input" placeholder="Вставь сюда условие задачи... (Enter — отправить)" rows="3"></textarea>
  <button type="submit" id="send">Решить</button>
</form>

<script>
const messagesEl = document.getElementById('messages');
const form       = document.getElementById('chat-form');
const input      = document.getElementById('input');
const sendBtn    = document.getElementById('send');

// Публичный бесплатный шлюз (работает без ключа)
const API_URL = 'https://text.pollinations.ai/openai';
const MODEL = 'openai'; 

let history = [
  { 
    role: 'system', 
    content: 'Ты — экспертный программист. Твоя задача — решать задачи по Python и C++. Отвечай кратко. Если в задаче просят "написать ТОЛЬКО функцию", твой ответ должен содержать только код функции, без тестов, без вызовов, без `if __name__ == "__main__"`, без markdown-разметки (без ```python). Просто чистый код. Если нужно полное решение — пиши его.' 
  }
];
let busy = false;

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy) return;

  const text = input.value.trim();
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  busy = true; sendBtn.disabled = true;
  const typing = addMsg('typing', 'пишу код...');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        temperature: 0.2, // Низкая температура для точного кода
      }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    let answer = data.choices?.[0]?.message?.content;

    if (!answer) throw new Error('Пустой ответ от сервера');

    // Очищаем от маркдауна, если ИИ его добавил
    answer = answer.replace(/```(python|cpp|c\+\+|javascript)?\n?/g, '').replace(/```/g, '');

    typing.remove();
    addMsg('bot', answer);
    history.push({ role: 'assistant', content: answer });

  } catch (err) {
    typing.remove();
    addMsg('error', 'Ошибка сети: ' + err.message + '. Если школа блокирует, попробуй дома или с телефона.');
    history.pop();
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
});
</script>

</body>
</html>
